<title>AnounisGaming</title>
<meta name="theme-color" content="#0B0D12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
@font-face{font-family:"AG Display";font-weight:500 700;src:url(fonts/space-grotesk.woff2) format("woff2");font-display:swap}
@font-face{font-family:"AG Body";font-weight:400 700;src:url(fonts/inter.woff2) format("woff2");font-display:swap}

/* Concept : un écran de veille de salle d'arcade. Fond très sombre, une seule couleur vive
   (le rouge « REC » des directs), et des badges de couleur qui disent la nature de l'info. */
:root{
  --bg:#0B0D12; --surface:#141821; --surface2:#1C2230; --line:#262E3E;
  --fg:#EDF0F5; --muted:#8A94A7; --faint:#5D6679;
  --accent:#FF4655; --accent-soft:rgba(255,70,85,.14);
  --rumor:#F5A524; --rumor-soft:rgba(245,165,36,.14);
  --ps5:#4C8DFF; --ps5-soft:rgba(76,141,255,.15);
  --pc:#2FCFA9; --pc-soft:rgba(47,207,169,.14);
  --ok:#3FD07A; --ok-soft:rgba(63,208,122,.14);
  --display:"AG Display","Space Grotesk",system-ui,sans-serif;
  --body:"AG Body","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0;overscroll-behavior-y:contain}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.01em;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}

#app{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* En-tête */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px 6px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);display:inline-block;animation:rec 2.4s ease-in-out infinite}
@keyframes rec{50%{opacity:.35}}
.iconbtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.updated{font-size:12px;color:var(--muted);margin-top:-2px}

/* Filtres */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;outline:none}
.search:focus{border-color:var(--muted)}

/* Cartes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;width:100%;display:block}
.hero .media{aspect-ratio:16/9;background:var(--surface2) center/cover no-repeat;position:relative}
.hero .body{padding:14px 14px 16px;display:flex;flex-direction:column;gap:8px}
.hero h2{font-size:21px}
.item{display:flex;gap:12px;padding:12px;align-items:flex-start}
.item .thumb{width:96px;height:72px;border-radius:10px;background:var(--surface2) center/cover no-repeat;flex:none;position:relative}
.item h3{font-size:15.5px;font-weight:600;font-family:var(--body);letter-spacing:0;line-height:1.3}
.item .txt{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.card.read{opacity:.55}
.meta{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.meta .dot{width:3px;height:3px;border-radius:50%;background:var(--faint)}
.flag{font-size:11px;font-weight:700;letter-spacing:.04em;padding:1px 5px;border-radius:5px;background:var(--surface2);color:var(--muted)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11.5px;font-weight:700;letter-spacing:.02em;padding:3px 8px;border-radius:6px;text-transform:uppercase}
.b-rumor{background:var(--rumor-soft);color:var(--rumor)}
.b-ps5{background:var(--ps5-soft);color:var(--ps5)}
.b-pc{background:var(--pc-soft);color:var(--pc)}
.b-off{background:var(--ok-soft);color:var(--ok)}
.b-more{background:var(--surface2);color:var(--muted);text-transform:none}
.play{position:absolute;inset:0;display:grid;place-items:center}
.play span{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;backdrop-filter:blur(4px)}
.thumb .play span{width:30px;height:30px}
.play svg{width:22px;height:22px;fill:#fff;margin-left:3px}
.thumb .play svg{width:13px;height:13px;margin-left:2px}
.more{padding:14px;text-align:center;color:var(--muted);font-weight:600;border:1px dashed var(--line);border-radius:var(--r);width:100%}

/* Article */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:30;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sheet-in{max-width:620px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) calc(150px + env(safe-area-inset-bottom,0px))}
.art-media{border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;background:var(--surface2) center/cover no-repeat;position:relative;margin-top:8px}
.art-media iframe{width:100%;height:100%;border:0;display:block}
.art h1{font-size:25px;margin-top:4px}
.art .lead{font-size:16.5px;line-height:1.6;color:#D3D8E2}
.orig{font-size:13px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
.warn{background:var(--rumor-soft);border:1px solid rgba(245,165,36,.35);border-radius:12px;padding:12px 14px;font-size:14px;color:#F7D9A3}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:12px;font-weight:700;font-size:15px;background:var(--surface);border:1px solid var(--line)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.block{width:100%}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.list{display:flex;flex-direction:column}
.list a,.list button{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;text-align:left;width:100%}
.list a:last-child,.list button:last-child{border-bottom:0}
.section-t{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:8px}

/* Lecteur */
.player{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:40;padding-inline:12px;pointer-events:none}
.player-in{max-width:600px;margin:0 auto;background:#202737;border:1px solid #2E3850;border-radius:16px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:12px;pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.player .t{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .s{font-size:12px;color:var(--muted)}
.bar{height:3px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.pbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--fg);color:var(--bg);flex:none}
.pbtn svg{width:18px;height:18px;fill:currentColor}
.pbtn.ghost{background:none;color:var(--muted)}

/* Navigation */
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(11,13,18,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;font-size:12px;font-weight:600;color:var(--faint)}
.nav button svg{width:23px;height:23px}
.nav button[aria-current="page"]{color:var(--fg)}
.nav button[aria-current="page"] svg{color:var(--accent)}

/* Prix */
.price-row{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--line)}
.price-row:last-child{border-bottom:0}
.price-row .eur{font-family:var(--display);font-weight:700;font-size:20px;min-width:78px}
.price-row.best{background:var(--accent-soft)}
.cut{font-weight:700;color:var(--ok);font-size:12.5px}
.risk{font-size:11.5px;font-weight:600}
.risk.high{color:var(--accent)} .risk.mid{color:var(--rumor)} .risk.low{color:var(--muted)}
.game{display:flex;gap:12px;align-items:center;padding:10px;text-align:left;width:100%}
.game img{width:46px;height:62px;object-fit:cover;border-radius:8px;background:var(--surface2);flex:none}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
.input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
.input:focus{border-color:var(--muted)}
.ok{color:var(--ok)} .err{color:var(--accent)}
.empty{text-align:center;padding:40px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty svg{width:44px;height:44px;color:var(--faint)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:#C9CFDA}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch input{width:20px;height:20px;accent-color:var(--accent)}
.skel{background:linear-gradient(90deg,var(--surface) 0,var(--surface2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:var(--r)}
@keyframes sh{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:60;max-width:90vw;text-align:center}
/* ================= SKINS ================= */
@font-face{font-family:"Press Start 2P";font-weight:400;src:url(fonts/press-start-2p.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Rajdhani";font-weight:600;src:url(fonts/rajdhani-600.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Rajdhani";font-weight:700;src:url(fonts/rajdhani-700.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Exo 2";font-weight:100 900;src:url(fonts/exo-2.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Sora";font-weight:100 800;src:url(fonts/sora.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Manrope";font-weight:200 800;src:url(fonts/manrope.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Chakra Petch";font-weight:500;src:url(fonts/chakra-petch-500.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Chakra Petch";font-weight:600;src:url(fonts/chakra-petch-600.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Chakra Petch";font-weight:700;src:url(fonts/chakra-petch-700.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Barlow";font-weight:400;src:url(fonts/barlow-400.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Barlow";font-weight:600;src:url(fonts/barlow-600.woff2) format("woff2");font-display:swap}
:root{--label:var(--display)}
.chip,.badge,.nav button,.section-t{font-family:var(--label)}
.skinx{display:none}

/* Choix de skin dans les réglages */
.skins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.skin-card{border-radius:14px;border:2px solid var(--line);overflow:hidden;text-align:left;background:var(--surface)}
.skin-card[aria-pressed="true"]{border-color:var(--accent)}
.skin-card .sw{height:64px;display:flex;align-items:flex-end;padding:8px;gap:5px}
.skin-card .sw i{width:16px;height:16px;border-radius:4px;display:block}
.skin-card .nm{padding:8px 10px;font-weight:700;font-size:14px}

/* ---------- 1. NÉON ARCADE ---------- */
body[data-skin="neon"]{
  --bg:#07070F; --surface:#0F0E1E; --surface2:#1A1834; --line:#2B2852;
  --fg:#ECEBFF; --muted:#9C98C9; --faint:#6E6A9C;
  --accent:#22E4FF; --accent-soft:rgba(34,228,255,.12); --accent2:#FF2BD6;
  --rumor:#FFE14D; --rumor-soft:rgba(255,225,77,.08);
  --ps5:#6FA8FF; --ps5-soft:transparent; --pc:#22E4FF; --pc-soft:transparent; --ok:#5CFF9D; --ok-soft:transparent;
  --display:"Rajdhani",var(--body); --body:"Exo 2",system-ui,sans-serif; --label:"Press Start 2P",monospace; --r:14px;
}
body[data-skin="neon"]::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0,rgba(255,255,255,.025) 1px,transparent 1px,transparent 4px)}
body[data-skin="neon"] .brand{font-family:var(--label);font-size:14px;letter-spacing:1px;gap:6px}
body[data-skin="neon"] .brand i{display:none}
body[data-skin="neon"] .brand .b1{color:var(--accent);text-shadow:0 0 10px rgba(34,228,255,.7)}
body[data-skin="neon"] .brand .b2{color:var(--accent2);text-shadow:0 0 10px rgba(255,43,214,.7)}
body[data-skin="neon"] .updated{font-family:var(--label);font-size:8px;text-transform:uppercase;margin-top:6px;display:flex;align-items:center;gap:6px}
body[data-skin="neon"] .updated::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent2);box-shadow:0 0 8px var(--accent2)}
body[data-skin="neon"] .iconbtn{border:1.5px solid var(--accent);color:var(--accent);background:var(--accent-soft);box-shadow:0 0 12px rgba(34,228,255,.35);border-radius:10px}
body[data-skin="neon"] .iconbtn:nth-child(2n){border-color:var(--accent2);color:var(--accent2);background:rgba(255,43,214,.08);box-shadow:0 0 12px rgba(255,43,214,.35)}
body[data-skin="neon"] .chip{font-size:9px;text-transform:uppercase;border-radius:8px;border-width:1.5px;padding:10px 13px;background:transparent;color:#C9C6F2}
body[data-skin="neon"] .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#07070F;box-shadow:0 0 14px rgba(34,228,255,.6)}
body[data-skin="neon"] .card{border-width:1.5px}
body[data-skin="neon"] .card.hero{border-color:var(--accent2);box-shadow:0 0 18px rgba(255,43,214,.35)}
body[data-skin="neon"] .card.is-rumor{border-color:var(--rumor);background:var(--rumor-soft);box-shadow:0 0 12px rgba(255,225,77,.18)}
body[data-skin="neon"] .hero h2{font-size:24px;line-height:1.08}
body[data-skin="neon"] .item h3{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.15}
body[data-skin="neon"] .badge{font-size:8px;padding:6px 7px;border-radius:5px;border:1px solid currentColor;background:transparent}
body[data-skin="neon"] .b-rumor{background:var(--rumor);color:#07070F;border-color:var(--rumor)}
body[data-skin="neon"] .b-more{color:var(--muted)}
body[data-skin="neon"] .flag{font-family:var(--label);font-size:7px}
body[data-skin="neon"] .hero-tag{display:block;position:absolute;left:12px;top:12px;font-family:var(--label);font-size:8px;color:#07070F;background:var(--rumor);padding:6px 8px;border-radius:4px}
body[data-skin="neon"] .play span{border:2px solid var(--accent);box-shadow:0 0 14px rgba(34,228,255,.6);background:rgba(7,7,15,.7)}
body[data-skin="neon"] .play svg{fill:var(--accent)}
body[data-skin="neon"] .nav button{font-size:8px;text-transform:uppercase;gap:7px}
body[data-skin="neon"] .nav button[aria-current="page"]{color:var(--accent);text-shadow:0 0 8px rgba(34,228,255,.7)}
body[data-skin="neon"] .btn.primary{background:var(--accent);border-color:var(--accent);color:#07070F;box-shadow:0 0 14px rgba(34,228,255,.5)}
body[data-skin="neon"] .warn{border-color:var(--rumor);color:#FFF1A8}
body[data-skin="neon"] .art h1{font-size:28px}

/* ---------- 2. CONSOLE NOUVELLE GÉNÉRATION ---------- */
body[data-skin="console"]{
  --bg:#070B16; --surface:rgba(255,255,255,.06); --surface2:#1C2440; --line:rgba(255,255,255,.14);
  --fg:#F2F5FB; --muted:rgba(242,245,251,.68); --faint:rgba(242,245,251,.45);
  --accent:#FFFFFF; --accent-soft:rgba(255,255,255,.14);
  --rumor:#F5B43C; --rumor-soft:#F5B43C; --ps5:#5B8CFF; --ps5-soft:#5B8CFF; --pc:#2FCFA9; --pc-soft:#2FCFA9; --ok:#3FD07A; --ok-soft:#3FD07A;
  --display:"Sora",system-ui,sans-serif; --body:"Manrope",system-ui,sans-serif; --label:"Manrope",system-ui,sans-serif; --r:18px;
}
body[data-skin="console"] .badge{color:#0B1020;border-radius:999px;font-weight:800;letter-spacing:.06em}
body[data-skin="console"] .b-ps5,body[data-skin="console"] .b-more{color:#fff}
body[data-skin="console"] .b-more{background:rgba(255,255,255,.16)}
body[data-skin="console"] .brand{font-size:17px;font-weight:600;gap:10px}
body[data-skin="console"] .brand i{animation:none;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.14);box-shadow:none;border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700}
body[data-skin="console"] .brand i::after{content:"AG"}
body[data-skin="console"] .updated{margin-left:46px}
body[data-skin="console"] .iconbtn{border-radius:50%;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22)}
body[data-skin="console"] .chip{border-radius:999px;background:rgba(255,255,255,.06);color:#DCE3F2}
body[data-skin="console"] .chip[aria-pressed="true"]{background:#fff;color:#070B16;border-color:#fff}
body[data-skin="console"] .search{border-radius:999px;background:rgba(255,255,255,.06)}
body[data-skin="console"] .card{backdrop-filter:blur(10px)}
body[data-skin="console"] .ambient{display:block;position:fixed;left:-60px;right:-60px;top:-60px;height:520px;background-size:cover;background-position:center;filter:blur(38px) saturate(1.3);opacity:.55;z-index:-1}
body[data-skin="console"] .ambient::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,11,22,.1) 0%,#070B16 92%)}
body[data-skin="console"] .chero{display:flex;flex-direction:column;gap:10px;padding-top:56px;text-align:left}
body[data-skin="console"] .chero .tag{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:1.5px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25)}
body[data-skin="console"] .chero h2{font-size:27px;line-height:1.15;letter-spacing:-.5px}
body[data-skin="console"] .chero .btns .btn{border-radius:999px;height:48px}
body[data-skin="console"] .chero .btns .btn.primary{background:#fff;color:#070B16;border-color:#fff}
body[data-skin="console"] .rail-t{display:block;font-family:var(--display);font-weight:600;font-size:16px}
body[data-skin="console"] .rail{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;scroll-snap-type:x mandatory}
body[data-skin="console"] .rail::-webkit-scrollbar{display:none}

/* ---------- 3. HUD DE JEU ---------- */
body[data-skin="hud"]{
  --bg:#0A0D10; --surface:#12171C; --surface2:#1B2229; --line:#2A333B;
  --fg:#E6ECEF; --muted:#93A1AC; --faint:#66727C;
  --accent:#FF8A1F; --accent-soft:rgba(255,138,31,.12); --xp:#B6FF3B;
  --rumor:#FFD23F; --rumor-soft:transparent; --ps5:#6FA8FF; --ps5-soft:transparent; --pc:#4FC3FF; --pc-soft:transparent; --ok:#B6FF3B; --ok-soft:transparent;
  --display:"Chakra Petch",system-ui,sans-serif; --body:"Barlow",system-ui,sans-serif; --label:"Chakra Petch",system-ui,sans-serif; --r:0px;
  --cut:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
}
body[data-skin="hud"]::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background-image:linear-gradient(rgba(255,138,31,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,138,31,.05) 1px,transparent 1px);background-size:26px 26px}
body[data-skin="hud"] .card,body[data-skin="hud"] .box,body[data-skin="hud"] .search,body[data-skin="hud"] .btn,body[data-skin="hud"] .iconbtn,body[data-skin="hud"] .warn{clip-path:var(--cut);border-radius:0}
body[data-skin="hud"] .card.hero{border-color:var(--accent)}
body[data-skin="hud"] .hero-tag{display:block;position:absolute;left:0;top:0;padding:6px 12px;background:var(--accent);color:#0A0D10;font-family:var(--label);font-weight:700;font-size:12px;letter-spacing:1.5px}
body[data-skin="hud"] .hero .media::after{content:"";position:absolute;right:10px;top:10px;width:18px;height:18px;border-top:2px solid var(--accent);border-right:2px solid var(--accent)}
body[data-skin="hud"] .chip{border-radius:0;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);text-transform:uppercase;letter-spacing:1px;padding:9px 16px;color:#C4CED6}
body[data-skin="hud"] .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#0A0D10}
body[data-skin="hud"] .badge{border-radius:0;border:1px solid currentColor;letter-spacing:1px}
body[data-skin="hud"] .b-rumor{border:0;padding-left:0}
body[data-skin="hud"] .b-rumor::before{content:"◆ "}
body[data-skin="hud"] .item h3{font-family:var(--display);font-weight:600;font-size:16px}
body[data-skin="hud"] .card.is-rumor{border-left:3px solid var(--rumor)}
body[data-skin="hud"] .play span{border-radius:0;border:2px solid var(--accent);background:rgba(10,13,16,.7)}
body[data-skin="hud"] .play svg{fill:var(--accent)}
body[data-skin="hud"] .player-card{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);clip-path:var(--cut)}
body[data-skin="hud"] .player-card .hex{width:44px;height:44px;flex:none;background:var(--accent);color:#0A0D10;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:16px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
body[data-skin="hud"] .player-card .nm{display:flex;justify-content:space-between;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.5px}
body[data-skin="hud"] .player-card .lv{color:var(--xp)}
body[data-skin="hud"] .xpbar{height:6px;background:#222B33;margin:5px 0}
body[data-skin="hud"] .xpbar i{display:block;height:100%;background:var(--xp)}
body[data-skin="hud"] .nav-in{gap:8px;padding:8px 10px}
body[data-skin="hud"] .nav button{flex-direction:row;justify-content:center;gap:8px;height:50px;padding:0;background:#161C22;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);text-transform:uppercase;letter-spacing:1px;font-weight:700;color:#C4CED6}

/* éléments propres à un skin, masqués ailleurs */
.hero-tag,.ambient,.rail-t,.player-card,.nav .slot{display:none}
body[data-skin="hud"] .player-card{display:flex}

/* ---------- V2 : bons plans, brief, rumeurs ---------- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}

.regions .btn{padding:11px 10px;font-size:14px}
.wish{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}

.gallery img{height:150px;border-radius:12px;flex:none;scroll-snap-align:start;background:var(--surface2)}
.rel{display:inline-flex;gap:3px;vertical-align:middle}
.rel i{width:14px;height:6px;border-radius:2px;background:var(--line);display:block}
.rel i.on{background:var(--rumor)}
.warn.confirme{background:var(--ok-soft);border-color:var(--ok);color:var(--fg)}
.warn.dementi{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.brief-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--rumor-soft);color:var(--rumor);flex:none}
.brief-ic svg{width:22px;height:22px}

body[data-skin="hud"] .brief{clip-path:var(--cut);border-color:var(--xp)}
body[data-skin="hud"] .brief b::before{content:"◆ ";color:var(--xp)}
body[data-skin="console"] .seg,body[data-skin="console"] .seg button{border-radius:999px}
body[data-skin="hud"] .seg,body[data-skin="hud"] .seg button{border-radius:0}
body[data-skin="hud"] .seg button[aria-pressed="true"]{background:var(--accent);color:#0A0D10}
body[data-skin="neon"] .seg button{font-size:9px;text-transform:uppercase}
body[data-skin="neon"] .seg button[aria-pressed="true"]{background:var(--accent);color:#07070F}

/* ---------- V3 ---------- */
.live{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:var(--r);background:var(--accent);color:#fff}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
