name: Robot d'actu

# Heures en UTC : un passage par heure de 7 h à 23 h (heure de Paris), plus deux la nuit.
# Réglé pour rester dans les 2 000 minutes gratuites par mois d'un dépôt privé.
on:
  schedule:
    - cron: "17 5-21 * * *"
    - cron: "17 0,3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: robot/requirements.txt

      - name: Installer le robot
        run: pip install -r robot/requirements.txt

      - name: Récupérer le fil précédent
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data
            git worktree add --detach data-out FETCH_HEAD
          else
            git worktree add --detach data-out
            git -C data-out rm -rf -q .
          fi

      - name: Lire, traduire, regrouper, enregistrer l'audio
        env:
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python robot/robot.py --out data-out

      - name: Publier le fil sur la branche data
        working-directory: data-out
        run: |
          git config user.name "Robot AnounisGaming"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # un seul commit à chaque passage : le dépôt ne grossit pas avec le temps
          git checkout -q --orphan snapshot
          git add -A
          git commit -q -m "Fil du $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q -f origin HEAD:data
