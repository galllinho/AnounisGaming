name: Construire l'APK AnounisGaming

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "robot/**"
      - ".github/workflows/robot.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: |
          npm ci --no-audit --no-fund > npm.log 2>&1 || npm install --no-audit --no-fund > npm.log 2>&1 || {
            tail -n 15 npm.log | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Préparer le projet Android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          npm run android:prepare > prep.log 2>&1 || {
            tail -n 20 prep.log | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Construire l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon > gradle.log 2>&1 || {
            grep -E "error|FAILURE|What went wrong" -A3 gradle.log | head -n 25 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          cp app/build/outputs/apk/release/app-release.apk ../AnounisGaming.apk

      - name: Publier une version téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AnounisGaming 1.0.${{ github.run_number }}
          body: APK à installer sur Android. Télécharge AnounisGaming.apk depuis ton téléphone.
          files: AnounisGaming.apk
          make_latest: true
